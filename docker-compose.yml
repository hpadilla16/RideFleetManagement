# Log rotation (2026-08-23, GDPR Wave 2 Phase C — 3.10 log-retention gap).
# Docker's default json-file driver NEVER rotates, so container logs grew
# unbounded until they filled the disk. Cap each container at 5 x 10 MB.
# Reused by every service below via the YAML anchor.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    container_name: fleet-db
    logging: *default-logging
    environment:
      POSTGRES_DB: fleet_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - fleet_pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: fleet-backend
    logging: *default-logging
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      # Override .env's host-side DATABASE_URL so the backend container can reach the db service
      # (host uses localhost:5433 for `npm run dev` + `npx prisma`; container uses db:5432).
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/fleet_management?schema=public
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npm run dev"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: fleet-frontend
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:4000
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend

volumes:
  fleet_pg_data:
