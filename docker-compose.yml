services:
  db:
    image: postgres:16-alpine
    container_name: fleet-db
    environment:
      POSTGRES_DB: fleet_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - fleet_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fleet-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: fleet-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      # Override .env's host-side DATABASE_URL so the backend container can reach the db service
      # (host uses localhost:5433 for `npm run dev` + `npx prisma`; container uses db:5432).
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/fleet_management?schema=public
      # Override .env's host-side REDIS_URL (localhost:6379) so the backend
      # container talks to the redis service inside the compose network.
      # Required because the BullMQ enqueueCounterCheckin call in
      # POST /counter/start-checkin awaits the queue connection — without
      # Redis it hangs forever.
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npm run dev"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
    container_name: fleet-worker
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/fleet_management?schema=public
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npx prisma generate && node src/worker.js"
    depends_on:
      - db
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
    container_name: fleet-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:4000
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend

volumes:
  fleet_pg_data:
