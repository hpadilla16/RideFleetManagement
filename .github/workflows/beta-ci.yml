name: beta-ci

# WHAT TRIGGERS THIS, AND WHY EACH ONE IS HERE
#
# `push: branches: [main]` exists because most work lands on main DIRECTLY, not
# through a pull request, and the tag trigger stopped firing when the project
# stopped cutting v* tags (v0.9.0-beta.379 is not even an ancestor of main).
# Between those two facts, a run of commits reached main having passed no check
# at all — the PR trigger below never saw them, and no tag was ever pushed.
#
# So this is not belt-and-braces with the PR trigger. It is the only thing
# covering the path that is actually used. Keep both: the PR trigger reports
# BEFORE the merge, this one guarantees main itself is never unverified.
on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # The training curriculum's anchor-integrity tests are the only thing
      # stopping a renamed element from silently breaking the tour on a new
      # employee's first screen. They ran nowhere until now (QA, 2026-08-14).
      - run: npx vitest run
      - run: npm run build

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run prisma:generate
      - run: node --check src/main.js
      - name: Resolve transitive imports
        # `node --check` only validates SYNTAX, not import resolution. A commit
        # with a missing transitive import (the class of bug behind BUG-003)
        # passes the syntax check and only fails when docker boots in the
        # tenant-isolation-suite job. SKIP_LISTEN=1 imports main.js without
        # opening a port; if any import is unresolvable, ERR_MODULE_NOT_FOUND
        # surfaces here in seconds instead of minutes later.
        env:
          SKIP_LISTEN: '1'
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/ci_resolve_only?schema=public'
          JWT_SECRET: 'ci-resolve-only'
          NODE_ENV: 'test'
        run: node -e "import('./src/main.js').then(() => process.exit(0)).catch((err) => { console.error('Transitive import failed:', err?.message || err); process.exit(1); })"

      - name: Money-path guard suites (B5 Phase 1)
        # These are DB-free and run in seconds. They exist to catch
        # SILENT failures that no other CI step would notice:
        #   test:payment-refs  — the partial unique index that IS the payment
        #     idempotency floor is invisible to Prisma; this asserts the
        #     migration predicate and the app's prefix constant cannot drift,
        #     and that no kiosk file imports a gateway client unwrapped.
        #   test:kiosk         — kiosk + payment guard/intent behavior.
        #   test:stale-preauth — the sweep must never stamp a deposit hold as
        #     voided without a real gateway void.
        #   test:money-route-gate — the structural guard: every gateway-calling
        #     or payment-destroying route must carry the paymentActions gate,
        #     and the money/record-only classification is re-derived from the
        #     service call graph on every run. A guard that does not run is
        #     documentation, so it belongs HERE, not only in `npm test`.
        #   test:payment-actions — paymentActions defaults per role + the
        #     anti-self-lockout carve-out on BOTH access paths.
        #   test:module-defaults-drift — the People create form pre-fills module
        #     checkboxes from a role map hand-copied out of module-access.js,
        #     and savePerson PUTs that map back as explicit per-user overrides.
        #     When the copy rots, creating a person silently GRANTS whatever the
        #     copy is missing. This loads both halves in one process and fails
        #     if they disagree. It needs the frontend/ tree, which the repo
        #     checkout above already provides.
        # NOTE: they are also wired into `npm test`, but that chain currently
        # hangs at an early suite lacking --test-force-exit, so it cannot be
        # relied on as the automatic gate. Run them explicitly here.
        #   - test:smart-match: the reservation code matcher (shared with the
        #     kiosk) AND the guard that every test:* script is reachable from
        #     `npm test`. Wiring that suite into the npm chain alone was NOT
        #     enough — the chain aborts long before reaching it, so the suite
        #     would have stayed effectively orphaned by a second mechanism
        #     (QA M3, 2026-08-06). DB-free, 0.2s.
        #   - test:shuttle-query: who sees whose shuttle customers. The shuttle
        #     integration suite needs embedded postgres and never runs here, so
        #     the scoping rules (a locationId filter INTERSECTS the caller's
        #     sedes, never widens) live in a pure module guarded on every push
        #     (2026-08-07).
        #   - test:with-timeout / test:rate-limit: no network call on a request
        #     path may be unbounded. The 2026-08-08 outage was a promise that
        #     never settled, which a try/catch cannot see; the same fix had
        #     been written in June and never committed, so the rule lives in a
        #     test now.
        #   - test:tolls-queue-counts: the queue tabs. Their counts decide what
        #     staff believe is left to do, and counting the loaded PAGE instead
        #     of the database once made the queue climb from 19 to 21 when they
        #     confirmed 19 rows.
        #   - test:extend-datetime: an extension's return date. A naive
        #     datetime-local read on a UTC container shifted every typed time
        #     back by the tenant offset, and it is invisible on a dev box in
        #     Puerto Rico — only CI and prod can catch it.
        #   - test:cash-flow: the forecast model. Committed money and projected
        #     money must never blend, and money already collected must never be
        #     forecast again — both are pure arithmetic, and both are the kind
        #     of error that reads as a plausible number (2026-08-07).
        #   - test:terms-signing: the public /api/sign payload the renter's
        #     phone reads while signing. It guards WHOSE NAME that page shows
        #     (it must never degrade to this platform's) and what else rides
        #     along in a no-auth payload. Wiring it into `npm test` alone was
        #     not enough for exactly the reason this whole NOTE exists — the
        #     chain never reaches it. DB-free (prisma is mocked),
        #     --test-force-exit, and it needs the dummy DATABASE_URL below like
        #     test:kiosk does (2026-08-17). src/lib/npm-test-chain.test.mjs
        #     asserts it stays on THIS list, not only in the npm chain.
        #   - test:tenant-brand: the cascade that decides WHOSE business name a
        #     customer sees. Shared by the counter display and the renter's
        #     phone, and its whole job is that neither of them ever falls
        #     through to this platform's name (2026-08-17).
        #   - test:finalize-email: the claim/release around the auto-email on
        #     checkout finalize. It holds three things at once — the customer
        #     is never mailed the contract twice, a stamped autoEmailedAt
        #     really means the send was accepted, and a send that was never
        #     accepted lands in AuditLog. 33 closed checkouts across two
        #     tenants sat marked "emailed" with no mail behind them for two
        #     months because nothing watched any of the three (2026-08-18).
        #     DB-free (prisma is mocked) and needs the dummy DATABASE_URL
        #     below like test:kiosk does. It is appended to BOTH `run:` lines
        #     of this step on purpose: the duplicate key is a live bug being
        #     fixed on another branch, and naming the suite on both lines
        #     means it survives whichever line that fix keeps.
        #   - test:checkout-multisurface (M2 P1/P2, 2026-08-17): the presence
        #     serializer must NEVER break the session poll, and STALE_VERSION
        #     must stay strictly opt-in — a regression here silently changes
        #     behavior for every pre-M2 client (web wizard, kiosk, precheckin).
        #   - test:presence-boundary (M2-H6, 2026-08-28): WHO receives the
        #     presence array. It carries staff full names and, since H6, the
        #     employee's actorUserId — safe only because the array is emitted
        #     on two requireAuth routes and reaches no customer-facing surface
        #     (the phone's handoff-token payload has none; the lobby kiosk
        #     writes presence and never reads it). That is a property of the
        #     ROUTING, not of the module, so it is re-derived from the source
        #     here on every run: a future route that serializes presence onto
        #     the public or device-authed surface fails this suite. The leak it
        #     guards would be invisible in review — a payload nobody reads, on
        #     a screen the customer is holding.
        #   - test:checkout-cas (M2-H8, 2026-08-17): the compare-and-set commit
        #     in transition(). Two surfaces on the same step must produce ONE
        #     hop, and the loser must be told the truth instead of a fake
        #     ILLEGAL_TRANSITION. Both halves are invisible without a forced
        #     race, so they can only ever be caught here — and one test pins
        #     the OPPOSITE: a concurrent stamp must NOT start failing
        #     transitions for clients that never opted into expectedVersion.
        #   - test:checkout-finalize-truth (2026-08-17): the finalize either
        #     happened or it did not, and both the agent and the customer's
        #     inbox have to agree with the database about which. Three defects
        #     made them disagree — a 409 the web wizard swallowed because the
        #     step had already committed, an email arm sitting UPSTREAM of the
        #     guards that decide whether the finalize is allowed, and a
        #     detached send promise whose rejection took the process down.
        #     Belongs here for the same reason as its siblings: every case
        #     needs the CLOSED cascade driven to a specific failure, which no
        #     integration run reaches on its own, and what it protects is a
        #     legal document going to a customer for a rental that never
        #     happened.
        # A DUMMY DATABASE_URL IS REQUIRED HERE, AND NOTHING CONNECTS WITH IT.
        # test:kiosk builds a PrismaClient at import time, and the Prisma
        # constructor THROWS on an undefined datasource url — before any
        # try/catch around connect can see it. Nothing in this job provides one,
        # so all 7 kiosk files failed with
        # `PrismaClientConstructorValidationError: Invalid value undefined for
        # datasource "db"` and this whole step exited 1.
        #
        # It went unnoticed because it is invisible on a dev box: Prisma
        # auto-loads backend/.env, which every developer has and CI does not. A
        # git worktree makes it worse — its node_modules is usually a symlink
        # into the main checkout, so the suite reads THAT .env and passes even
        # with no .env of its own. The same shape as beta.344.
        #
        # This is the identical dummy value the "Resolve transitive imports" step
        # above already uses. Same reason: satisfy a constructor, never connect.
        #
        #   - test:precheckin-tax-rate: WHICH tax rate the OTA pre-check-in
        #     charges. The rule is "a stored zero is a rate, not a missing
        #     value", and the DB-backed suite CANNOT test it: Prisma returns a
        #     Decimal OBJECT for the nullable column and `new Decimal(0)` is
        #     truthy, so the embedded case passes identically under `||` and
        #     under `== null`. Only a primitive 0 discriminates, which is why the
        #     rule was lifted into a pure resolveTaxRate() and is fed that 0 by
        #     hand here. Milliseconds, no database (2026-08-18). The embedded
        #     half runs in the precheckin-charges-embedded job below.
        #   test:declined-insurance — RentalAgreement.declinedInsurance decides
        #     which sections the customer must initial and whether the contract
        #     carries the decline addendum. The bug it guards was live: the
        #     reservation detail payload dropped the column, so the wizard's
        #     switch read OFF for a customer who HAD declined, and an agent
        #     touching it POSTed declined:false and erased the addendum from a
        #     signed contract. It also covers the step guard on the two writers
        #     and the 409-with-code mapping on the customer route. Being in the
        #     `npm test` chain is NOT enough — nothing in this workflow invokes
        #     `npm test`, which is the trap documented above.
        #
        #   test:customer-email / test:customer-email-writers — added 2026-09-01
        #     with the validate-the-address-at-capture fix. On 2026-08-31, 54
        #     sealed contracts had never been mailed; 20 of them carried an
        #     address that was PRESENT but not an address (MailerSend 422 /
        #     MS42208), the clearest one addressed to `GERENTE VOLVO`. Nothing
        #     between the keyboard and the mailer ever asked whether the string
        #     was an address, and the field feeding it is on the contract.
        #
        #     The first suite is the rule itself: what is refused, which
        #     odd-but-legal shapes must still pass, and the two audience
        #     sentences. The second is the RATCHET, and it is the half that
        #     matters in CI: it re-derives the set of files writing
        #     Customer.email / RentalAgreement.customerEmail and fails when a new
        #     writer ships unclassified OR when any existing one stops calling
        #     the shared gate. The same rule already existed in three files and
        #     was absent from eleven — that asymmetry is how the bad address got
        #     in, and only a machine can keep the inventory honest.
        #
        #     Both are DB-free and pass under the dummy DATABASE_URL below.
        #
        #   test:billing-suspension / test:billing-panel / test:billing-model —
        #     added 2026-08-28 with the restore-previous-status fix, and the
        #     FIRST billing suites in this workflow: `grep -n billing` on this
        #     file returned nothing before this line, so all 14 of them were
        #     relying on a human remembering to run them.
        #
        #     The bug they now guard was live and silent. restoreTenantAccess()
        #     hardcoded `status: 'ACTIVE'`, and 'ACTIVE' is not a label —
        #     public-tenant-token.js, booking-engine resolvePublicTenant() and
        #     the car-sharing marketplace list all match it exactly. So the
        #     Restore button PUBLISHED any tenant that had been something else
        #     onto the public booking site. Re-hardcoding that line is a one-word
        #     regression with no visible symptom until a customer's private
        #     tenant is serving bookings, which is exactly the shape that needs a
        #     machine watching it rather than a person.
        #
        #     All three are DB-free (billing-test-prisma.mjs) and pass under the
        #     dummy DATABASE_URL below; billing-model reads prisma/migrations and
        #     schema.prisma off disk, which is the only pre-production check the
        #     two 20260828 migrations get — there is no Postgres in this
        #     workflow.
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/ci_unit_only?schema=public'
        run: npm run test:payment-refs && npm run test:kiosk && npm run test:stale-preauth && npm run test:money-route-gate && npm run test:payment-actions && npm run test:module-defaults-drift && npm run test:smart-match && npm run test:shuttle-query && npm run test:cash-flow && npm run test:overdue-definition && npm run test:tolls-queue-counts && npm run test:extend-datetime && npm run test:toll-vehicle-swap && npm run test:with-timeout && npm run test:rate-limit && npm run test:imported-total && npm run test:prepaid-signal && npm run test:rental-minimum && npm run test:imported-fee-dedup && npm run test:backdated-return && npm run test:payment-search && npm run test:view-location && npm run test:declined-insurance && npm run test:terms-signing && npm run test:tenant-brand && npm run test:tenant-status && npm run test:checkout-multisurface && npm run test:checkout-cas && npm run test:presence-boundary && npm run test:precheckin-tax-rate && npm run test:billing-suspension && npm run test:billing-panel && npm run test:billing-model && npm run test:finalize-email && npm run test:checkout-finalize-truth && npm run test:customer-email && npm run test:customer-email-writers

  precheckin-charges-embedded:
    # THE PRE-CHECK-IN CHARGE SHEET, AGAINST A REAL TRANSACTION.
    #
    # WHY ITS OWN JOB. Every case in this suite is money a customer is charged:
    # atomicity of the charge-sheet rewrite, the 409 on a double-tapped Submit,
    # which tax rate an OTA booking pays, and what a PERCENTAGE insurance plan
    # prices against. All 21 of them ran NOWHERE until 2026-08-18 — the script is
    # deliberately out of the `npm test` chain (npm-test-chain.test.mjs KNOWN_OUT,
    # "DB-backed (embedded-postgres)", so the chain stays runnable on a laptop
    # with no Postgres), and nothing in this workflow invoked it. Two branches'
    # worth of money evidence rested on a suite CI never executed.
    #
    # AND NOT HUNG OFF THE MONEY-GUARD STEP, which is where it would naturally be
    # bolted on. That step runs with a DUMMY DATABASE_URL and no server behind it
    # (see the long note above); these tests open real transactions, so they
    # would fail there for a reason that has nothing to do with the code.
    #
    # AND NOT IN tenant-isolation-suite either, despite that job having Postgres:
    # that one is the docker-compose stack, and scripts/embedded-pg-boot.mjs
    # boots its OWN throwaway cluster on a free port and points DATABASE_URL at
    # it. It needs no service container and no compose file — only the npm
    # package, which `npm ci` does not install because it is not a dependency
    # (deliberately: it is a ~100MB platform binary no runtime path uses).
    #
    # The version is PINNED. `--no-save` writes no lockfile entry, so there is no
    # integrity hash and no reproducibility; and the dist-tag `latest` for this
    # package is currently a prerelease, so an unpinned install is a moving
    # target under a money suite.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # embedded-pg-boot.mjs runs `prisma db push` and `prisma generate` against
      # the cluster it starts, both through prisma's JS entry point. Generating
      # once up front keeps a failure here readable as "the client is broken"
      # rather than surfacing inside a test's before() hook.
      - run: npm run prisma:generate
      - run: npm install --no-save embedded-postgres@18.4.0-beta.17
      # No DATABASE_URL is set on purpose: bootEmbeddedPg() assigns
      # process.env.DATABASE_URL from the cluster it just started, before the
      # module under test is imported. A dummy value here would be overwritten,
      # and passing a real one would hide a regression in that ordering.
      - run: npm run test:precheckin-charges

  tenant-isolation-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate backend/.env for CI
        run: |
          cat > backend/.env <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@db:5432/fleet_management?schema=public"
          PORT=4000
          JWT_SECRET="ci-test-secret-do-not-use-in-prod"
          JWT_EXPIRES_IN="12h"
          ALLOW_PUBLIC_REGISTER="false"
          RATE_LIMIT_DISABLED="1"
          SENTRY_DSN=""
          SENTRY_ENV="ci"
          SENTRY_RELEASE=""
          SENTRY_TRACES_SAMPLE_RATE="0"
          EOF
      - name: Start stack
        run: docker compose -f docker-compose.yml up -d --build
      - name: Wait for backend
        run: |
          for i in {1..45}; do
            if curl -fsS http://localhost:4000/health >/dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend not ready after 90s"
          # WHY the container is not answering, not just THAT it is not. A container
          # still running `npm install` is Up with an empty log and looks identical to
          # one that crashed before flushing stdout — and on 2026-09-03 that ambiguity
          # cost an evening: zero log lines, /health resetting, and no way to tell the
          # two apart from the run output. Status + exit code separates them.
          echo "--- container state ---"
          docker compose -f docker-compose.yml ps -a || true
          docker inspect fleet-backend \
            --format 'status={{.State.Status}} exitCode={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} startedAt={{.State.StartedAt}} error={{.State.Error}}' || true
          echo "--- what the container command is actually doing ---"
          docker exec fleet-backend sh -lc 'ps -o pid,etime,args' 2>/dev/null || echo "(container not exec-able — it is not running)"
          echo "--- backend log, in full ---"
          docker compose -f docker-compose.yml logs --no-color backend || true
          exit 1
      - name: Seed tenants
        run: docker exec fleet-backend sh -lc "cd /app && node scripts/tenant-seed-beta.mjs && node scripts/tenant-seed-superadmin.mjs"
      - name: Run tenant isolation suite
        run: docker exec fleet-backend sh -lc "cd /app && node scripts/tenant-tests/run-suite.mjs"
      - name: Module-access audit trail (DB-backed)
        # Runs HERE, not in the DB-free money-guard step, because its whole
        # point is hitting real Postgres. The bug it guards against — writing a
        # permission audit into the reservation-scoped AuditLog, where the
        # required reservationId makes every insert throw into a best-effort
        # catch — is invisible to a mocked prisma. A green mock is exactly how
        # it shipped the first time.
        run: docker exec fleet-backend sh -lc "cd /app && npm run test:module-access-audit"
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=200
      - name: Shutdown stack
        if: always()
        run: docker compose -f docker-compose.yml down -v