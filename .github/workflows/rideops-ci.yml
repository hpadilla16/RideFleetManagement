name: rideops-ci

# RideOps (app Flutter de staff) — M0-3 del PROJECT_PLAN (ops-app-plan/).
#
# POR QUÉ GITHUB ACTIONS Y NO CODEMAGIC (decisión M0, 2026-08-16): el repo ya
# corre beta-ci.yml aquí, los secretos ya viven aquí, y no añadimos un vendor
# nuevo por conveniencia de UI. Lo único que Codemagic regala es macOS
# preconfigurado para iOS — y el parque de aparatos es Android-first (pregunta
# §9-4 del plan, pendiente de Hector); cuando toque iOS, GH Actions también
# tiene runners macOS. Si el mantenimiento de fastlane/firma en YAML se vuelve
# un dolor real, se revisita con evidencia.
#
# PATHS: además de rideops/**, este workflow corre cuando el BACKEND toca
# prisma/schema.prisma o state-machine.js — las dos fuentes de verdad del
# chequeo de paridad de enums. Un enum nuevo en el backend debe romper ESTE
# workflow en el mismo PR, no descubrirse cuando la app crashee parseando.
on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'rideops/**'
      - 'backend/prisma/schema.prisma'
      - 'backend/src/modules/checkout-session/state-machine.js'
      - '.github/workflows/rideops-ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'rideops/**'
      - 'backend/prisma/schema.prisma'
      - 'backend/src/modules/checkout-session/state-machine.js'
      - '.github/workflows/rideops-ci.yml'

jobs:
  enum-parity:
    # Corre primero y solo: es la compuerta barata (<1s) que protege el
    # contrato. Lee schema.prisma + state-machine.js y los compara contra
    # rideops/lib/core/api/enums.dart. Ver rideops/tool/check_enum_parity.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node rideops/tool/check_enum_parity.mjs

  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rideops
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Misma versión que fija .fvmrc — si subes una, sube la otra en el
          # mismo commit o el build local y el de CI divergen.
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  android-build:
    # El artefacto instalable. En PRs construye SIN firmar (suficiente para
    # probar que el build no está roto); en main firma con el keystore de los
    # secretos y sube el .apk como artifact. La firma se activa sola cuando
    # los 4 secretos existen: RIDEOPS_ANDROID_KEYSTORE_BASE64,
    # RIDEOPS_KEYSTORE_PASSWORD, RIDEOPS_KEY_ALIAS, RIDEOPS_KEY_PASSWORD.
    #
    # QUÉ DEBE CARGAR HECTOR ANTES DEL PRIMER BUILD DE DISTRIBUCIÓN:
    #   - variable de repo  RIDEOPS_API_BASE        = URL https:// real de la API
    #   - secreto           RIDEOPS_SENTRY_DSN      = DSN del proyecto rideops
    #   - los 4 secretos de keystore de arriba
    #
    # POR QUÉ LOS DART-DEFINE SON OBLIGATORIOS (QA de milestone M1, 2026-08-17):
    # `--flavor prod` decide el applicationId de Android, NO la config de la
    # app: `AppConfig.env` sale de RIDEOPS_ENV. Sin defines, el APK "prod"
    # compilaba verde con env=dev y apiBase=http://10.0.2.2:4000 (el localhost
    # del emulador), el guard de bootstrap quedaba mudo porque isProd=false, y
    # el manifest de prod bloquea cleartext ⇒ un APK FIRMADO que no alcanza
    # ninguna red. Verde en CI, ladrillo en el patio. De ahí el gate de abajo:
    # preferimos el job rojo y honesto.
    #
    # BACKLOG (M4): derivar `env` de FLUTTER_APP_FLAVOR para que flavor y env
    # no puedan divergir por olvido de un define.
    runs-on: ubuntu-latest
    needs: [ enum-parity ]
    defaults:
      run:
        working-directory: rideops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Materialize keystore (solo si hay secretos)
        env:
          KEYSTORE_B64: ${{ secrets.RIDEOPS_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RIDEOPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIDEOPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIDEOPS_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/rideops-release.keystore
            cat > android/key.properties <<EOF
          storeFile=rideops-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "signing=release" >> "$GITHUB_ENV"
          else
            echo "signing=debug" >> "$GITHUB_ENV"
          fi
      - name: Gate — la API base de prod debe existir y ser https
        # Falla ANTES de gastar el build. Sin esto el job produciría un APK
        # instalable pero incapaz de hablar con nadie (ver cabecera del job).
        env:
          API_BASE: ${{ vars.RIDEOPS_API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::error::Falta la variable de repositorio RIDEOPS_API_BASE (URL https:// de la API)."
            echo "::error::Cárgala en Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          case "$API_BASE" in
            https://*) ;;
            *) echo "::error::RIDEOPS_API_BASE debe ser https:// — recibido: $API_BASE"; exit 1 ;;
          esac
      - name: Build APK (flavor prod)
        env:
          API_BASE: ${{ vars.RIDEOPS_API_BASE }}
          SENTRY_DSN: ${{ secrets.RIDEOPS_SENTRY_DSN }}
        run: |
          flutter build apk --flavor prod --release \
            --dart-define=RIDEOPS_ENV=prod \
            --dart-define=RIDEOPS_API_BASE="$API_BASE" \
            --dart-define=RIDEOPS_SENTRY_DSN="$SENTRY_DSN"
      - uses: actions/upload-artifact@v7
        with:
          name: rideops-prod-apk-${{ env.signing }}
          path: rideops/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  # iOS: pendiente de la decisión §9-4 (Android-first). Cuando se apruebe:
  # runner macos-14, fastlane match o certificados en secretos, build ipa,
  # y subida de dSYMs a Sentry en el mismo job (compuerta de release).
