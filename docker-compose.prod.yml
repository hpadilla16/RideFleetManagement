services:
  db:
    image: postgres:16-alpine
    container_name: fleet-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleet_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB", "-c", "work_mem=4MB"]
    volumes:
      - fleet_pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fleet-backend-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      PUPPETEER_EXECUTABLE_PATH: /usr/local/bin/chrome
      CLUSTER_WORKERS: "4"
      # Pool sizing math: pool × workers must stay under Supabase pooler cap.
      # 2026-05-18: upgraded compute MICRO (max_connections=60) → LARGE
      # (max_connections=160 confirmed via SELECT current_setting) to onboard
      # a 5-location tenant. New math:
      #   backend: 24 × 4 workers = 96
      #   worker:  12 × 1 process  = 12
      #   total client conns: 108 / 160 = 67% — leaves 52 for migrations/admin
      # We route through the pgbouncer pooler (port 6543, ?pgbouncer=true)
      # so client connections multiplex onto fewer real DB connections under
      # typical load; the 160 cap is worst-case headroom.
      # Bump to 32 when we go XLARGE (max_connections check first).
      DATABASE_POOL_SIZE: "24"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15

  # Pillar 2 — BullMQ worker process.
  # Runs job handlers (auto-charge after checkin, future: snapshot jobs,
  # email retries, etc.). Same image as the API backend, different command.
  # Shares Redis Upstash (REDIS_URL in .env) with the cache pub/sub layer.
  # Pool kept small — workers do mostly DB reads + AuthNet API calls; the
  # API backend owns the heavy pool budget.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fleet-worker-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      # No PORT — workers don't expose HTTP
      # 2026-05-18: bumped 4 → 12 alongside Supabase LARGE upgrade.
      # Workers now run autocharge + future Apify scraper bulk-insert jobs;
      # 12 gives parallelism headroom while staying well under the pool cap.
      DATABASE_POOL_SIZE: "12"
      # Override the API's CLUSTER_WORKERS — irrelevant to this process
      CLUSTER_WORKERS: "0"
      # Worker tier statement timeout — 60s instead of API tier's 15s.
      # Justification: workers run batch jobs (market scraper writes hundreds
      # of pricing rows, future Excel rate imports, Apify scraper bulk insert)
      # that legitimately exceed 15s. Hot API endpoints stay capped at 15s
      # so a runaway query never holds a request thread.
      DATABASE_STATEMENT_TIMEOUT_MS: "60000"
    command: ["node", "src/worker.js"]
    depends_on:
      db:
        condition: service_healthy
    # No port mapping — internal-only process

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:4000}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENV: ${NEXT_PUBLIC_SENTRY_ENV:-production}
        NEXT_PUBLIC_SENTRY_RELEASE: ${NEXT_PUBLIC_SENTRY_RELEASE:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    container_name: fleet-frontend-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:4000}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENV: ${NEXT_PUBLIC_SENTRY_ENV:-production}
      NEXT_PUBLIC_SENTRY_RELEASE: ${NEXT_PUBLIC_SENTRY_RELEASE:-}
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.1}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15

volumes:
  fleet_pg_data_prod:
