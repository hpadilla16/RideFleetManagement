# Log rotation (2026-08-23, GDPR Wave 2 Phase C — 3.10 log-retention gap).
# Docker's default json-file driver NEVER rotates, so container logs grew
# unbounded until they filled the droplet disk. Cap each container at 5 x 10 MB.
# Reused by every service below via the YAML anchor.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  # NOTE (2026-06-09, Phase 0 hardening): the local `db` Postgres container
  # (fleet-db-prod) was REMOVED. Prod has run on Supabase Postgres (pgbouncer
  # :6543) since the LARGE upgrade — DATABASE_URL in backend/.env points there,
  # so the local container was dead weight (~300+ MB RAM on an 8 GB box).
  # The old named volume `fleet_pg_data_prod` is intentionally NOT deleted from
  # disk; remove it manually (`docker volume rm`) only after confirming nothing
  # historical is needed. Bring-up: use `--remove-orphans` once so the old
  # container is cleaned up.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fleet-backend-prod
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      PUPPETEER_EXECUTABLE_PATH: /usr/local/bin/chrome
      # Phase 0 (2026-06-09): cap concurrent Chromium pages per process —
      # covers PDF rendering (agreements/reports/inventory) and any manual
      # toll sync triggered from the API. Scheduled toll scraping moved to
      # the worker container.
      PUPPETEER_MAX_CONCURRENT_PAGES: "2"
      CLUSTER_WORKERS: "4"
      # Pool sizing math: pool × workers must stay under Supabase pooler cap.
      # 2026-05-18: upgraded compute MICRO (max_connections=60) → LARGE
      # (max_connections=160 confirmed via SELECT current_setting) to onboard
      # a 5-location tenant. New math:
      #   backend: 24 × 4 workers = 96
      #   worker:  12 × 1 process  = 12
      #   total client conns: 108 / 160 = 67% — leaves 52 for migrations/admin
      # We route through the pgbouncer pooler (port 6543, ?pgbouncer=true)
      # so client connections multiplex onto fewer real DB connections under
      # typical load; the 160 cap is worst-case headroom.
      # Bump to 32 when we go XLARGE (max_connections check first).
      DATABASE_POOL_SIZE: "24"
    ports:
      # BIND TO LOOPBACK ONLY (2026-08-22). "4000:4000" binds 0.0.0.0, which
      # published the production API on the droplet's public IP over plain
      # HTTP — http://<droplet-ip>:4000/api/... answered live, bypassing nginx
      # and TLS, so logins and bearer tokens could cross the internet in
      # cleartext. nginx already proxies to 127.0.0.1:4000, so scoping the
      # binding costs nothing and closes the bypass. The droplet has no
      # firewall enabled (ufw inactive), so this binding IS the control.
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15

  # Pillar 2 — BullMQ worker process.
  # Runs job handlers (auto-charge after checkin, future: snapshot jobs,
  # email retries, etc.). Same image as the API backend, different command.
  # Shares Redis Upstash (REDIS_URL in .env) with the cache pub/sub layer.
  # Pool kept small — workers do mostly DB reads + AuthNet API calls; the
  # API backend owns the heavy pool budget.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fleet-worker-prod
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      # No PORT — workers don't expose HTTP
      # 2026-05-18: bumped 4 → 12 alongside Supabase LARGE upgrade.
      # Workers now run autocharge + future Apify scraper bulk-insert jobs;
      # 12 gives parallelism headroom while staying well under the pool cap.
      DATABASE_POOL_SIZE: "12"
      # Override the API's CLUSTER_WORKERS — irrelevant to this process
      CLUSTER_WORKERS: "0"
      # Worker tier statement timeout — 60s instead of API tier's 15s.
      # Justification: workers run batch jobs (market scraper writes hundreds
      # of pricing rows, future Excel rate imports, Apify scraper bulk insert)
      # that legitimately exceed 15s. Hot API endpoints stay capped at 15s
      # so a runaway query never holds a request thread.
      DATABASE_STATEMENT_TIMEOUT_MS: "60000"
      # Phase 0 (2026-06-09): toll auto-sync scraping (headless Chromium) now
      # runs in THIS container instead of the API container. Same image as the
      # backend, so the Chrome binary is present — but the env var must be set
      # here too or puppeteer can't find it.
      PUPPETEER_EXECUTABLE_PATH: /usr/local/bin/chrome
      # Global cap on concurrent Chromium pages per process (see
      # backend/src/lib/puppeteer-browser.js). Scrapers are sequential per
      # sweep; 2 leaves headroom without letting RAM spike.
      PUPPETEER_MAX_CONCURRENT_PAGES: "2"
    command: ["node", "src/worker.js"]
    # No port mapping — internal-only process

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:4000}
        # Google Maps JS API key for the public shuttle tracker page.
        # NEXT_PUBLIC_* is inlined at BUILD time — set it in the root .env
        # BEFORE building the frontend image, or the page ships without a map
        # (it degrades to the card-only layout, no error).
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENV: ${NEXT_PUBLIC_SENTRY_ENV:-production}
        NEXT_PUBLIC_SENTRY_RELEASE: ${NEXT_PUBLIC_SENTRY_RELEASE:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    container_name: fleet-frontend-prod
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Loopback only — same reasoning as the backend above. nginx proxies to
      # 127.0.0.1:3000; nothing else should reach the Next server directly.
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:4000}
      NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENV: ${NEXT_PUBLIC_SENTRY_ENV:-production}
      NEXT_PUBLIC_SENTRY_RELEASE: ${NEXT_PUBLIC_SENTRY_RELEASE:-}
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.1}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
