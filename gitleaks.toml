title = "RideFleetManagement gitleaks config"

# Extends gitleaks' built-in ruleset (the full default rule pack) and adds an
# allowlist for the KNOWN CI / test dummy secrets that already live in this
# repo's workflows and test fixtures. Without this allowlist the secret-scan
# job in .github/workflows/security-scan.yml would fail permanently on these
# established, harmless fixtures instead of on genuinely new material.
#
# This allowlist is deliberately SPECIFIC. It names the exact dummy strings and
# a couple of example-only files. It does NOT blanket-allow real-looking
# secrets, and it does NOT globally ignore the whole test tree — a real secret
# accidentally committed into a *.test.mjs file would still trip the gate.
#
# Source of each entry (verified 2026-08-22):
#   - .github/workflows/beta-ci.yml            → JWT_SECRET + dummy DATABASE_URLs
#   - backend/src/**/*.test.mjs                → per-suite test JWT secrets
#   - backend/.env.example                     → placeholder JWT secret
#   - backend/src/modules/auth/auth.config.js  → the rejected insecure default

[extend]
useDefault = true

[allowlist]
description = "Known CI and test dummy secrets — not real credentials"
# Match against the whole line so a line CONTAINING one of these known dummy
# values is exempt, regardless of which default rule flagged it.
regexTarget = "line"
regexes = [
  # ── beta-ci.yml dummy JWT secrets ──────────────────────────────────────────
  '''ci-test-secret-do-not-use-in-prod''',
  '''ci-resolve-only''',

  # ── beta-ci.yml dummy DATABASE_URLs (postgres:postgres, throwaway DBs) ──────
  '''postgresql://postgres:postgres@localhost:5432/ci_unit_only''',
  '''postgresql://postgres:postgres@localhost:5432/ci_resolve_only''',
  '''postgresql://postgres:postgres@db:5432/fleet_management''',
  # doc/example connection strings that interpolate the local user, never a
  # real credential:
  '''postgresql://\$\(whoami\)@localhost:5432/fleet_management''',
  '''postgresql://u:p@localhost:5432/db''',

  # ── per-suite test JWT secrets in backend/src/**/*.test.mjs ─────────────────
  '''test-jwt-secret-for-account-deletion''',
  '''test-jwt-secret-for-inspection''',
  '''test-secret-for-password-gate-tests-0123456789''',
  '''test-secret-for-service-auth-tests-0123456789''',
  '''test-secret-for-va-commission-tests-0123456789''',
  '''test-secret-for-mileage-override-tests-0123456789''',
  '''test-secret-for-kiosk-staff-assist-0123456789''',
  '''test-secret-key''',
  # Added 2026-08-28, after secret-scan went red on main. Each was verified
  # before listing, per the rule above: every one appears EXACTLY ONCE in the
  # repo, on a `process.env.JWT_SECRET =` line inside a test file, and in no
  # .env, ops script or workflow.
  '''test-secret-for-logout-revocation-tests-0123456789''',
  '''test-secret-for-two-factor-tests-0123456789''',
  '''test-secret-for-tenant-suspension-gate-0123456789''',

  # ── Authorize.Net webhook signature-key fixture ────────────────────────────
  # Added 2026-08-28. A 64-character hex string is the real shape of an HMAC
  # signature key, which is why gitleaks flags it and why the fixture uses it:
  # the tests verify signature verification against the exact format the
  # merchant portal issues. Unlike the `sk-ant-` fixtures renamed on the same
  # day, the SHAPE is load-bearing here, so this is allowlisted rather than
  # reshaped. The value itself is visibly synthetic — ascending byte pairs
  # (A1 B2 C3 D4 E5 F6 …) repeated twice — and appears in exactly two test
  # files and nowhere else.
  '''A1B2C3D4E5F60718293A4B5C6D7E8F90A1B2C3D4E5F60718293A4B5C6D7E8F90''',

  # ── placeholder / rejected-default secrets (never accepted at runtime) ──────
  '''change-this-secret''',
  '''dev-secret-change-me''',

  # ── payment-capabilities redaction canaries ─────────────────────────────────
  # Added 2026-09-01, after secret-scan went red on main from 75f818d0's window.
  # payment-capabilities.test.mjs exists to prove that a config SATURATED with
  # secret material never leaks through the capabilities endpoint — so its
  # SECRET_MARKERS deliberately wear the real prefixes (sk_live_, pk_live_,
  # whsec_) that gitleaks' stock Stripe rules match on. The SHAPE is
  # load-bearing, same rationale as the Authorize.Net fixture above: reshape
  # the canary and the test stops proving redaction of realistic material.
  # Every value embeds the marker "LEAK…77xy", is visibly synthetic, and
  # appears exactly once in the repo (verified with git grep 2026-09-01).
  '''sk_live_LEAK77xy''',
  '''pk_live_LEAK77xy''',
  '''whsec_LEAK77xy''',

  # ── generic-api-key false positives in backend/src/**/*.test.mjs ────────────
  # Added 2026-09-05, after secret-scan went red on main (runs for 24142b41,
  # a8c86ed0, 45afafa4). All four are fixture literals that the stock
  # generic-api-key rule matches on SHAPE (a `key:`/`token`/`ApiKey` word next
  # to an identifier-looking string). Each was verified with
  # `git log --all -S<value>` before listing: every one lives in exactly ONE
  # test file across the full history and in no .env, ops script or workflow.
  # Listed as exact literals — not a path-wide exemption — so a real secret
  # committed into a *.test.mjs file still trips the gate.
  # refund-rails.test.mjs: SPIN idempotency key derived from the notes string
  '''RFM-RES-1-1756224061''',
  # telematics-onestepgps.test.mjs: it is the TEST TITLE ("hasApiKey/clearApiKey
  # work"), not a value at all
  '''hasApiKey/clearApiKey''',
  # card-on-file.test.mjs (43f49d71, file no longer at tip): dummy iPOS token.
  # .gitleaksignore already covers line 65 of that commit by fingerprint; the
  # same literal recurs on line 72, so allowlist the value instead of chasing
  # line numbers.
  '''tok_saved_abc123''',
  # counter-orchestrator.service.test.mjs (0464d39f, file no longer at tip):
  # makeRefId input, a fake reservation id
  '''reservation_xyz_12345678''',
]

# Example/template files that only ever contain placeholders.
paths = [
  '''backend/\.env\.example$''',
]
