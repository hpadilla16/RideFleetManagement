name: rideops
description: App nativa de patio para el personal de Ride Fleet (ADMIN / OPS / AGENT).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ADR-2 — stack cerrado.
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.7.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # Bandeja de salida cifrada (ADR-7): Drift sobre SQLCipher.
  drift: ^2.28.0
  sqlcipher_flutter_libs: ^0.6.0

  # Token seguro (Keychain/Keystore). Sujeto del spike M0-1a.
  flutter_secure_storage: ^9.2.0

  # Observabilidad (decisión M0-4: Sentry — el backend ya reporta ahí).
  sentry_flutter: ^9.0.0

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
  generate: true # flutter gen-l10n — es/en desde el primer commit (ADR-8)
