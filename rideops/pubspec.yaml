name: rideops
description: App nativa de patio para el personal de Ride Fleet (ADMIN / OPS / AGENT).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ADR-2 — stack cerrado.
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.7.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # Bandeja de salida cifrada (ADR-7): Drift sobre SQLCipher. sqlite3 va
  # PINEADO a 2.x a propósito: el open de H5 enruta el loader nativo a
  # libsqlcipher vía `package:sqlite3/open.dart` (open.overrideFor), API que
  # sqlite3 3.x eliminó (bindings @Native estáticos por native-assets, sin
  # override en runtime — y sqlcipher_flutter_libs 0.7 está EOL). Migrar a
  # 3.x exige otra vía de carga de SQLCipher: trabajo explícito de M4, no un
  # bump casual. El pin arrastra drift a 2.31 (compatible con todo lo usado).
  drift: ^2.28.0
  sqlcipher_flutter_libs: ^0.6.0
  sqlite3: ^2.4.0

  # Cifrado de archivos de foto en disco (H5, ADR-7): AES-GCM 256 con llave en
  # secure storage. Los binarios NO viven en la fila del outbox — solo el path.
  cryptography: ^2.7.0

  # Captura de inspección (H5): un controlador por SESIÓN de captura,
  # compresión NATIVA path-a-path apenas se toma la foto (DoD #8).
  camera: ^0.11.0
  flutter_image_compress: ^2.4.0

  # Drenado en foreground (H5): disparo al reconectar. El drenado en
  # background con WorkManager es H6.
  connectivity_plus: ^6.1.0

  # Token seguro (Keychain/Keystore). Sujeto del spike M0-1a.
  flutter_secure_storage: ^9.2.0

  # PIN local + biometría (H2). crypto: hash del PIN (nunca texto plano);
  # local_auth: huella como tecla del keypad; clock: reloj inyectable para
  # testear el timer de inactividad con fake_async.
  crypto: ^3.0.3
  local_auth: ^2.3.0
  clock: ^1.1.1

  # Spike 1 (M0-1a): tareas en background. Si el spike aprueba, se queda para
  # el drenado; si no, se retira y el drenado va solo en foreground.
  workmanager: ^0.10.0
  path_provider: ^2.1.0

  # Observabilidad (decisión M0-4: Sentry — el backend ya reporta ahí).
  sentry_flutter: ^9.0.0

  # QR del paso T&C (M2-H2). Se elige el codificador PURO (`qr`, sin widget)
  # en vez de `qr_flutter`: el paquete Flutter no se publica desde 2023 y lo
  # único que aporta es un CustomPainter que aquí tiene que ser NUESTRO —
  # quiet zone de 4 módulos, negro puro 21:1 y el estado "vencido" del 10D son
  # reglas del sistema de diseño, no de un paquete. Codificar QR a mano
  # (Reed–Solomon + máscaras) sí sería temerario en una ruta de firma legal:
  # un QR mal codificado deja al cliente sin poder firmar.
  qr: ^4.0.0

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Timer de inactividad + reloj fake en los tests del LockController (H2).
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
  generate: true # flutter gen-l10n — es/en desde el primer commit (ADR-8)
