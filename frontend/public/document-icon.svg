<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Document">
  <!--
    Neutral tab icon for the (public) route group — the pages a CUSTOMER opens
    from a tokenized link on their own phone. Deliberately carries no wordmark,
    no monogram and none of the Ride brand purple: on those pages the only
    business named anywhere is the tenant's, and a platform mark in the tab
    selector undoes that. A plain document glyph in UI grey, matching the
    signing page's own palette (#374151 / #6B7280 / #E5E7EB / #F9FAFB).
  -->
  <rect width="64" height="64" rx="12" fill="#F9FAFB"/>
  <path d="M18 11h18l12 12v30a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3z"
        fill="#FFFFFF" stroke="#374151" stroke-width="3" stroke-linejoin="round"/>
  <path d="M36 11v12h12" fill="none" stroke="#374151" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#6B7280">
    <rect x="22" y="31" width="20" height="3" rx="1.5"/>
    <rect x="22" y="38" width="20" height="3" rx="1.5"/>
    <rect x="22" y="45" width="12" height="3" rx="1.5"/>
  </g>
</svg>
