<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ride Fleet — Reconnecting</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: linear-gradient(180deg, #faf7ff 0%, #f4f1ff 100%); color: #29223f;
        text-align: center;
      }
      main { width: min(420px, calc(100vw - 48px)); }
      .logo {
        width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 18px;
        background: linear-gradient(135deg, #8752FE, #6d3df2);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 34px; font-weight: 800;
        box-shadow: 0 14px 32px rgba(135, 82, 254, 0.35);
      }
      h1 { margin: 0 0 8px; font-size: 1.4rem; }
      p { margin: 0 0 20px; line-height: 1.55; color: #6f668f; font-size: 0.95rem; }
      button {
        min-height: 52px; padding: 0 28px; border: none; border-radius: 16px;
        background: linear-gradient(180deg, #9460ff, #8752FE); color: #fff;
        font-size: 1rem; font-weight: 800; cursor: pointer;
        box-shadow: 0 10px 22px rgba(135, 82, 254, 0.32);
      }
      #status { margin-top: 16px; font-size: 0.85rem; color: #6f668f; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">R</div>
      <h1>Can't reach Ride Fleet</h1>
      <p>Check your connection. The app retries automatically — your work in progress is saved.</p>
      <button onclick="retry()">Retry now</button>
      <div id="status"></div>
    </main>
    <script>
      var APP_URL = 'https://ridefleetmanager.com';
      var attempt = 0;
      function setStatus(msg) { document.getElementById('status').textContent = msg; }
      function retry() {
        attempt += 1;
        setStatus('Reconnecting…');
        // Probe first so a dead network doesn't bounce us straight back here.
        fetch(APP_URL + '/favicon.ico', { mode: 'no-cors', cache: 'no-store' })
          .then(function () { window.location.replace(APP_URL); })
          .catch(function () { setStatus('Still offline (attempt ' + attempt + ')'); });
      }
      window.addEventListener('online', retry);
      setInterval(function () { if (navigator.onLine !== false) retry(); }, 5000);
    </script>
  </body>
</html>
