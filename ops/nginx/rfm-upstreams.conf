# Zero-downtime blue-green upstreams (2026-08-22).
# Lives at /etc/nginx/conf.d/rfm-upstreams.conf on the droplet. ops/deploy.sh
# rewrites the server ports here and runs `nginx -s reload` to flip traffic
# between the blue (fleet-*-prod, :4000/:3000) and green (fleet-*-green,
# :4010/:3010) containers during a deploy — a graceful reload drains existing
# connections, so no request is dropped.
#
# The site server block proxies to these names:
#   location /api/  ->  proxy_pass http://rfm_backend;
#   location /      ->  proxy_pass http://rfm_frontend;
#
# `max_fails=0` disables passive failure ejection: we control which port is live
# explicitly via reload, and never want nginx to blackhole the only upstream.
upstream rfm_backend {
    server 127.0.0.1:4000 max_fails=0;
}
upstream rfm_frontend {
    server 127.0.0.1:3000 max_fails=0;
}
